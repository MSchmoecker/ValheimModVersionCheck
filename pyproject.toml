[project]
name = "valheim-mod-version-check"
version = "0.11.1"
description = "A Discord bot that reads mod versions from a BepInEx logfile and checks those against the Thunderstore API and the Nexus API."
readme = "Readme.md"
requires-python = ">=3.11,<3.12"
license = { file = "LICENSE" }
dependencies = [
    "discord.py==2.7.1",
    "requests~=2.34.2",
    "python-dotenv~=1.2.3",
    "readerwriterlock~=1.0.9",
    "fastapi==0.141.1",
    "uvicorn==0.54.0",
    "pydantic==2.13.5",
    "starlette==1.7.0",
    "PyYAML~=6.0.1",
]

[tool.uv]
package = false

[dependency-groups]
dev = ["pytest~=8.3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
